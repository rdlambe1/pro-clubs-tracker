<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FC Pro Clubs Live Tracker</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body { background-color: #0b0f19; color: #cbd5e1; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    .card { background-color: #111827; border: 1px solid #1f2937; border-radius: 10px; }
  </style>
</head>
<body class="p-4 md:p-8">
  <div class="max-w-6xl mx-auto space-y-6">

    <!-- Header & Search Controls -->
    <header class="flex flex-col md:flex-row items-center justify-between gap-4 border-b border-gray-800 pb-6">
      <div class="flex items-center gap-3">
        <i class="fa-solid fa-shield-halved text-emerald-400 text-3xl"></i>
        <h1 class="text-2xl font-black text-white tracking-wide">CLUBS<span class="text-emerald-400">TRACKER</span></h1>
      </div>

      <div class="flex flex-wrap items-center gap-2 w-full md:w-auto">
        <select id="platformSelect" class="bg-gray-800 border border-gray-700 px-3 py-2 rounded text-sm text-gray-200 focus:outline-none focus:border-emerald-500">
          <option value="common-gen5" selected>PS5 / XSX / PC</option>
          <option value="common-gen4">PS4 / Xbox One</option>
          <option value="nx">Nintendo Switch</option>
        </select>

        <input id="searchInput" type="text" placeholder="Club Name or ID (e.g. Doge Rovers)" value="Doge Rovers" 
               class="bg-gray-800 border border-gray-700 px-4 py-2 rounded text-sm text-white focus:outline-none focus:border-emerald-500 flex-1 md:w-72"
               onkeydown="if(event.key === 'Enter') handleSearch()">

        <button onclick="handleSearch()" class="bg-emerald-500 hover:bg-emerald-600 text-black font-bold px-5 py-2 rounded text-sm transition">
          Search
        </button>
      </div>
    </header>

    <!-- Status Banner -->
    <div id="statusBanner" class="hidden text-sm px-4 py-3 rounded"></div>

    <!-- Multi-Match Disambiguation List -->
    <div id="matchesCard" class="hidden card p-4 space-y-3">
      <h3 class="text-xs font-semibold text-gray-400 uppercase tracking-wider">Multiple clubs found. Select yours:</h3>
      <div id="matchesList" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-3"></div>
    </div>

    <!-- Active Club Card -->
    <section class="card p-6 flex flex-col md:flex-row justify-between items-center gap-6">
      <div class="flex items-center gap-5">
        <div class="w-20 h-20 bg-gray-800 rounded-full flex items-center justify-center border-2 border-emerald-500 text-2xl font-black text-white" id="clubInitials">
          FC
        </div>
        <div>
          <h2 id="clubName" class="text-3xl font-extrabold text-white">No Club Loaded</h2>
          <p id="clubMeta" class="text-gray-400 text-sm mt-1">Ready to search</p>
        </div>
      </div>
      <div class="grid grid-cols-3 gap-6 text-center border-t md:border-t-0 md:border-l border-gray-800 pt-4 md:pt-0 md:pl-8">
        <div>
          <div class="text-gray-400 text-xs uppercase tracking-wider">Record (W-D-L)</div>
          <div id="clubRecord" class="text-xl font-bold text-white mt-1">-- - -- - --</div>
        </div>
        <div>
          <div class="text-gray-400 text-xs uppercase tracking-wider">Skill Rating</div>
          <div id="skillRating" class="text-xl font-bold text-emerald-400 mt-1">--</div>
        </div>
        <div>
          <div class="text-gray-400 text-xs uppercase tracking-wider">Goals (Scored/Con)</div>
          <div id="goalStats" class="text-xl font-bold text-white mt-1">-- / --</div>
        </div>
      </div>
    </section>

    <!-- Squad Members Performance -->
    <section class="card p-6 space-y-4">
      <h3 class="text-lg font-bold text-white flex items-center gap-2">
        <i class="fa-solid fa-users text-emerald-400"></i> Squad Performance
      </h3>

      <div class="overflow-x-auto">
        <table class="w-full text-left text-sm">
          <thead class="border-b border-gray-800 text-gray-400 uppercase text-xs">
            <tr>
              <th class="py-3 px-2">Player</th>
              <th class="py-3 px-2 text-center">Matches</th>
              <th class="py-3 px-2 text-center">Goals</th>
              <th class="py-3 px-2 text-center">Assists</th>
              <th class="py-3 px-2 text-center">Avg Rating</th>
              <th class="py-3 px-2 text-center">Pass %</th>
              <th class="py-3 px-2 text-center">MoTM</th>
            </tr>
          </thead>
          <tbody id="membersTable" class="divide-y border-gray-800">
            <tr><td colspan="7" class="py-6 text-center text-gray-500">Search for a club above to load squad.</td></tr>
          </tbody>
        </table>
      </div>
    </section>

  </div>

  <script>
    const API_BASE = '/api';

    function setStatus(msg, isErr = false) {
      const banner = document.getElementById('statusBanner');
      if (!msg) {
        banner.classList.add('hidden');
        return;
      }
      banner.classList.remove('hidden');
      banner.innerText = msg;
      banner.className = isErr 
        ? 'text-sm px-4 py-3 rounded bg-red-950/80 border border-red-800 text-red-200' 
        : 'text-sm px-4 py-3 rounded bg-gray-800 border border-gray-700 text-gray-300';
    }

    async function handleSearch() {
      const input = document.getElementById('searchInput').value.trim();
      const platform = document.getElementById('platformSelect').value;
      const matchesCard = document.getElementById('matchesCard');
      matchesCard.classList.add('hidden');

      if (!input) return;

      // 1. Direct Numeric ID Search
      if (/^\d+$/.test(input)) {
        loadClub(input, platform);
        return;
      }

      // 2. Club Name Search
      setStatus(`Searching EA for "${input}"...`);
      try {
        const res = await fetch(`${API_BASE}/search?clubName=${encodeURIComponent(input)}&platform=${platform}`);
        const data = await res.json();

        if (!res.ok || !data) {
          setStatus(`No clubs found matching "${input}". Check spelling or platform.`, true);
          return;
        }

        // Normalize data shape (handles array of clubs OR key-value dictionary)
        const parsedClubs = [];

        if (Array.isArray(data)) {
          data.forEach(item => {
            const id = item.clubId || item.id || item.clubInfo?.clubId;
            const name = item.name || item.clubName || item.clubInfo?.name || input;
            if (id) parsedClubs.push({ id: String(id), name });
          });
        } else if (typeof data === 'object') {
          Object.entries(data).forEach(([key, val]) => {
            // EA often uses the key itself as the Club ID (e.g. {"28268": {...}})
            const id = val?.clubId || val?.id || val?.clubInfo?.clubId || (/^\d+$/.test(key) ? key : null);
            const name = val?.name || val?.clubName || val?.clubInfo?.name || input;
            if (id) parsedClubs.push({ id: String(id), name });
          });
        }

        if (parsedClubs.length === 0) {
          setStatus(`Could not resolve a Club ID for "${input}". Try searching by numeric ID directly.`, true);
          return;
        }

        // If only 1 result, load it immediately
        if (parsedClubs.length === 1) {
          setStatus(`Found ${parsedClubs[0].name} (ID: ${parsedClubs[0].id}). Loading records...`);
          loadClub(parsedClubs[0].id, platform);
          return;
        }

        // If multiple clubs found, show options to select
        setStatus(`Found ${parsedClubs.length} matching clubs. Choose yours:`);
        renderMatches(parsedClubs, platform);

      } catch (err) {
        setStatus(`Search error: ${err.message}`, true);
      }
    }

    function renderMatches(clubs, platform) {
      const card = document.getElementById('matchesCard');
      const list = document.getElementById('matchesList');
      list.innerHTML = '';

      clubs.forEach(c => {
        const div = document.createElement('div');
        div.className = 'p-3 rounded bg-gray-800/80 hover:bg-gray-800 border border-gray-700 cursor-pointer flex justify-between items-center transition';
        div.innerHTML = `
          <div>
            <div class="font-bold text-white">${c.name}</div>
            <div class="text-xs text-gray-400">ID: ${c.id}</div>
          </div>
          <button class="text-xs bg-emerald-500 hover:bg-emerald-600 text-black font-semibold px-2.5 py-1 rounded">Select</button>
        `;
        div.onclick = () => {
          card.classList.add('hidden');
          loadClub(c.id, platform);
        };
        list.appendChild(div);
      });

      card.classList.remove('hidden');
    }

    async function loadClub(clubId, platform) {
      setStatus(`Loading club #${clubId}...`);
      try {
        const [infoRes, memRes] = await Promise.all([
          fetch(`${API_BASE}/club/${clubId}/info?platform=${platform}`),
          fetch(`${API_BASE}/club/${clubId}/members?platform=${platform}`)
        ]);

        const info = await infoRes.json();
        const memData = await memRes.json();

        if (!infoRes.ok) {
          setStatus(`Failed to fetch stats for ID ${clubId}: ${info.error || 'Club not found'}`, true);
          return;
        }

        renderClub(clubId, info, platform);
        renderMembers(memData);
        setStatus('');
      } catch (e) {
        setStatus(`Error loading stats: ${e.message}`, true);
      }
    }

    function renderClub(clubId, info, platform) {
      const clubObj = info[clubId] || info;
      const name = clubObj.name || clubObj.clubName || 'Unknown Club';
      const wins = clubObj.wins ?? clubObj.record?.wins ?? 0;
      const ties = clubObj.ties ?? clubObj.record?.ties ?? 0;
      const losses = clubObj.losses ?? clubObj.record?.losses ?? 0;
      const goals = clubObj.goals ?? clubObj.record?.goals ?? 0;
      const conceded = clubObj.goalsAgainst ?? clubObj.record?.goalsAgainst ?? 0;
      const rating = clubObj.skillRating || clubObj.rating || '--';

      document.getElementById('clubName').innerText = name;
      document.getElementById('clubInitials').innerText = name.substring(0, 2).toUpperCase();
      document.getElementById('clubMeta').innerText = `Club ID: ${clubId} | Platform: ${platform}`;
      document.getElementById('clubRecord').innerText = `${wins} - ${ties} - ${losses}`;
      document.getElementById('skillRating').innerText = rating;
      document.getElementById('goalStats').innerText = `${goals} / ${conceded}`;
    }

    function renderMembers(data) {
      const tbody = document.getElementById('membersTable');
      tbody.innerHTML = '';

      let list = [];
      if (Array.isArray(data)) {
        list = data;
      } else if (data.members && Array.isArray(data.members)) {
        list = data.members;
      } else if (typeof data === 'object') {
        list = Object.values(data.members || data);
      }

      if (!list.length) {
        tbody.innerHTML = '<tr><td colspan="7" class="py-6 text-center text-gray-500">No member records found for this club.</td></tr>';
        return;
      }

      list.forEach(m => {
        const name = m.name || m.proName || m.gamertag || 'Unknown';
        const games = m.gamesPlayed ?? m.games ?? 0;
        const goals = m.goals ?? 0;
        const assists = m.assists ?? 0;
        const rating = parseFloat(m.ratingAve || m.rating || 0).toFixed(1);
        const pass = m.passSuccessRate ?? m.passSuccess ?? 0;
        const motm = m.manOfTheMatch ?? m.motm ?? 0;

        const tr = document.createElement('tr');
        tr.className = 'hover:bg-gray-800/40 transition border-b border-gray-800/60';
        tr.innerHTML = `
          <td class="py-3 px-2 font-medium text-white">${name}</td>
          <td class="py-3 px-2 text-center text-gray-300">${games}</td>
          <td class="py-3 px-2 text-center font-bold text-emerald-400">${goals}</td>
          <td class="py-3 px-2 text-center text-gray-300">${assists}</td>
          <td class="py-3 px-2 text-center text-yellow-400 font-semibold">${rating}</td>
          <td class="py-3 px-2 text-center text-gray-300">${pass}%</td>
          <td class="py-3 px-2 text-center text-purple-400">${motm}</td>
        `;
        tbody.appendChild(tr);
      });
    }

    window.onload = handleSearch;
  </script>
</body>
</html>
